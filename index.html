<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>喵机妙算 · Meowracle Machine</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="wrap">
    <header>
      <div class="logo">🐾</div>
      <h1>喵机妙算</h1>
      <div class="en">Meowracle Machine</div>
      <div class="sub">让猫在键盘上滚一圈,把乱码破译成你的下一个产品创意。</div>
    </header>

    <section class="panel">
      <label class="field">选择今日产品军师猫(决定创意风格)</label>
      <select id="persona">
        <option value="ragdoll">性冷淡极简派 · 冷淡布偶</option>
        <option value="orange">激进颠覆派 · 暴躁橘猫</option>
        <option value="black">暗黑增长派 · 阴湿黑猫</option>
        <option value="calico">AI 原生派 · 赛博三花</option>
        <option value="siamese">商业变现派 · 油腻暹罗</option>
        <option value="tabby">打工人体恤派 · 加班狸花</option>
      </select>

      <!-- 降临台:实时捕捉猫滚动时按出的按键流 -->
      <div id="stage" class="stage idle">
        <div id="stageIdle" class="stage-idle">
          <div class="stage-emoji">⌨️🐈</div>
          <p class="stage-tip">把猫抱到键盘上,让它滚一圈、踩几脚、用尾巴扫一下。<br/>它每按一个键,都会从词库里召唤一个真实概念,最后由猫军师破译成产品创意。</p>
          <button class="primary big" id="startBtn">🐾 开始(把猫放上键盘)</button>
          <button class="linklike" id="humanBtn">没有猫?我自己乱敲一行 →</button>
        </div>

        <div id="stageLive" class="stage-live hidden">
          <div class="live-status"><span class="dot"></span> 猫正在召唤概念…(滚完后点下面的「破译创意」)</div>
          <div id="liveStream" class="live-stream"></div>
          <div class="live-meters">
            <div><span id="mCount">0</span><small>击键</small></div>
            <div><span id="mDur">0.0</span><small>秒</small></div>
            <div><span id="mRate">0.0</span><small>键/秒</small></div>
          </div>
          <button class="primary big" id="stopBtn">✨ 猫滚完了,破译创意</button>
        </div>
      </div>
      <div class="disclaimer">本产品由「猫的随机性 + 维基随机词条 + AI 硬凑」驱动,创意仅供 vibe,不构成商业建议。猫不为融资失败负责。</div>
    </section>

    <section id="cardWrap" class="hidden"></section>

    <div class="foot">
      人类负责立项,猫负责乱按,AI 负责硬凑创意。<br />
      别人靠用户调研,你靠猫的屁股。
    </div>
  </div>

  <!-- 隐藏输入框:真正接收猫的键盘事件 -->
  <textarea id="capture" class="capture-hidden" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>

  <script src="oracle.js"></script>
  <script>
    const $ = (s) => document.querySelector(s);
    let capturing = false, startTs = 0, lastChar = "", buffer = "";
    const cap = $("#capture");

    function setStage(state) {
      $("#stage").className = "stage " + state;
      $("#stageIdle").classList.toggle("hidden", state !== "idle");
      $("#stageLive").classList.toggle("hidden", state !== "live");
    }

    function spawnPaw(ch) {
      const el = document.createElement("span");
      el.className = "paw-pop";
      el.textContent = /\s/.test(ch) ? "🐾" : ch;
      el.style.left = (10 + Math.random() * 80) + "%";
      el.style.fontSize = (16 + Math.random() * 26) + "px";
      el.style.setProperty("--rot", (Math.random() * 60 - 30) + "deg");
      $("#liveStream").appendChild(el);
      setTimeout(() => el.remove(), 1200);
    }

    function refreshMeters() {
      const sec = (performance.now() - startTs) / 1000;
      $("#mCount").textContent = buffer.length;
      $("#mDur").textContent = sec.toFixed(1);
      $("#mRate").textContent = (buffer.length / Math.max(0.1, sec)).toFixed(1);
    }

    function onKey(e) {
      if (!capturing) return;
      // 拦截,免得猫触发浏览器快捷键/刷新/导航
      if (e.key === "Tab" || e.key === " " || e.key === "/" || e.key === "'" ) e.preventDefault();
      let ch = "";
      if (e.key.length === 1) ch = e.key;
      else if (e.key === "Enter") ch = "\n";
      else if (e.key === "Tab") ch = "\t";
      else return; // 纯修饰键(Shift/Ctrl…)不计入字符
      buffer += ch;
      lastChar = ch;
      // 实时大字流:只保留尾部一段,避免猫滚太久爆屏
      const tail = buffer.slice(-40);
      $("#liveStream").dataset.tail = tail;
      const stamp = document.createElement("b");
      stamp.textContent = /\s/.test(ch) ? "·" : ch;
      $("#liveStream").appendChild(stamp);
      while ($("#liveStream").querySelectorAll("b").length > 40) {
        $("#liveStream").querySelector("b").remove();
      }
      spawnPaw(ch);
      refreshMeters();
    }

    function startCapture() {
      buffer = ""; lastChar = ""; startTs = performance.now();
      capturing = true;
      $("#liveStream").innerHTML = "";
      setStage("live");
      cap.value = "";
      cap.focus();
      refreshMeters();
    }

    function stopCapture() {
      capturing = false;
      const text = buffer.trim();
      const finalText = text || cap.value.trim();
      setStage("idle");
      runOracle(finalText, $("#persona").value);
    }

    // 流程：先用本地引擎兜底出完整结构，再请服务端（维基随机词条 + AI 破译）覆盖。
    // 服务不可用时静默回退到本地破译。
    async function runOracle(finalText, persona) {
      let res = window.MeowOracle.localIdea(finalText, persona);
      res.raw = finalText;
      res.aiPowered = false;
      showLoading();
      try {
        const r = await fetch("/api/oracle", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ raw: finalText, persona }),
        });
        const data = await r.json();
        if (data && data.ok && data.idea) {
          res = {
            raw: finalText,
            entries: Array.isArray(data.entries) && data.entries.length ? data.entries : res.entries,
            personaName: data.personaName || res.personaName,
            idea: data.idea,
            meters: data.meters || res.meters,
            aiPowered: true,
          };
        }
      } catch (e) {
        // 网络/服务异常：保留本地破译
      }
      render(res);
    }

    function showLoading() {
      $("#cardWrap").innerHTML = `
        <div class="card loading-card">
          <div class="loading-cat">🐈‍⬛✨</div>
          <div class="loading-text">猫军师正在破译这串乱码…</div>
          <div class="loading-sub">（正在从维基百科召唤随机概念，再让 AI 硬凑成产品创意）</div>
        </div>`;
      $("#cardWrap").classList.remove("hidden");
      $("#cardWrap").scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // 猫可能踩到屏幕/触控板 → 兜底:把焦点抓在隐藏输入框
    cap.addEventListener("keydown", onKey);
    document.addEventListener("keydown", (e) => { if (capturing && document.activeElement !== cap) onKey(e); });

    $("#startBtn").addEventListener("click", startCapture);
    $("#stopBtn").addEventListener("click", () => stopCapture());

    // 人类伪装:弹个输入,系统鄙视你
    $("#humanBtn").addEventListener("click", () => {
      const t = prompt("没有猫?自己乱敲一行当种子(猫军师不保证质量):", "");
      if (t == null) return;
      runOracle(t.trim(), $("#persona").value);
    });

    /* ---------- 渲染产品创意卡 ---------- */
    function render(res) {
      const idea = res.idea || {};
      const entries = res.entries || [];
      const meters = res.meters || {};
      const feats = Array.isArray(idea.features) ? idea.features : [];

      const used = Array.isArray(idea.usedConcepts) ? idea.usedConcepts : [];
      const isUsed = (title) => used.some((u) => u && (u === title || u.includes(title) || title.includes(u)));
      const usedCount = entries.filter((e) => isUsed(e.title)).length;
      const entriesBox = `
        <div class="section-title">猫从词库召唤的概念 ${entries.length ? `<small class="dim">(${usedCount}/${entries.length} 有料,其余被猫划掉)</small>` : ""}</div>
        <div class="entries">
          ${entries.map((e) => `<div class="entry ${isUsed(e.title) ? "used" : "ignored"}"><span class="ec">${escapeHtml(e.char)}</span><span class="ea">→</span><span class="et">${escapeHtml(e.title)}</span></div>`).join("")}
        </div>`;

      const html = `
        <div class="card" id="card">
          <div class="head">
            <span class="title">🐾 猫滚出的产品创意</span>
            <span class="persona">军师:${escapeHtml(res.personaName || "")}${res.aiPowered ? ' · <em class="ai-badge">AI 破译</em>' : ' · <em class="ai-badge offline">本地破译</em>'}</span>
          </div>
          <div class="body">
            <div class="oracle-raw">${escapeHtml(res.raw) || "（猫只是路过,什么都没踩——那就随机召唤几个概念吧）"}</div>

            ${entriesBox}

            <div class="product-name">${escapeHtml(idea.productName || "无名产品")}</div>
            <div class="tagline">${escapeHtml(idea.tagline || "")}</div>

            <div class="section-title">核心创意</div>
            <div class="reading">${escapeHtml(idea.concept || "")}</div>

            <div class="section-title">关键功能</div>
            <ul class="features">${feats.map((f) => `<li>${escapeHtml(f)}</li>`).join("")}</ul>

            <div class="grid2">
              <div class="box"><div class="k">目标用户</div><div class="v">${escapeHtml(idea.targetUser || "")}</div></div>
              <div class="box"><div class="k">技术栈氛围</div><div class="v">${escapeHtml(idea.techVibe || "")}</div></div>
            </div>

            <div class="section-title">猫军师毒舌点评</div>
            <div class="warn">${escapeHtml(idea.catWisdom || "")}</div>

            <div class="meters">
              <div class="meter"><div class="lab"><span>落地可行性</span><span>${meters.feasibility ?? 0}%</span></div><div class="bar"><div class="fill trust" style="width:${meters.feasibility ?? 0}%"></div></div></div>
              <div class="meter"><div class="lab"><span>vibe 浓度</span><span>${meters.vibe ?? 0}%</span></div><div class="bar"><div class="fill comfort" style="width:${meters.vibe ?? 0}%"></div></div></div>
              <div class="meter"><div class="lab"><span>投资人困惑度</span><span>${meters.investorConfusion ?? 0}%</span></div><div class="bar"><div class="fill nonsense" style="width:${meters.investorConfusion ?? 0}%"></div></div></div>
            </div>
          </div>
        </div>
        <div class="actions">
          <button class="ghost" id="copyBtn">📋 复制创意去立项</button>
          <button class="ghost" id="againBtn">🐾 再让猫滚一个</button>
        </div>`;
      $("#cardWrap").innerHTML = html;
      $("#cardWrap").classList.remove("hidden");
      $("#cardWrap").scrollIntoView({ behavior: "smooth", block: "start" });
      $("#copyBtn").addEventListener("click", () => copyText(res));
      $("#againBtn").addEventListener("click", () => { $("#cardWrap").classList.add("hidden"); window.scrollTo({ top: 0, behavior: "smooth" }); startCapture(); });
    }

    function copyText(res) {
      const idea = res.idea || {};
      const entries = res.entries || [];
      const meters = res.meters || {};
      const feats = Array.isArray(idea.features) ? idea.features : [];
      const t =
`🐾 猫滚出的产品创意 · ${idea.productName || ""}(军师:${res.personaName || ""})
乱码种子:${res.raw}
召唤概念:${entries.map((e) => e.title).join("、")}
采用概念:${(Array.isArray(idea.usedConcepts) && idea.usedConcepts.length ? idea.usedConcepts : ["—"]).join("、")}

【定位】${idea.tagline || ""}
【核心创意】${idea.concept || ""}
【关键功能】${feats.join(" / ")}
【目标用户】${idea.targetUser || ""}
【技术栈氛围】${idea.techVibe || ""}
【猫军师点评】${idea.catWisdom || ""}
落地可行性 ${meters.feasibility ?? 0}% · vibe 浓度 ${meters.vibe ?? 0}% · 投资人困惑度 ${meters.investorConfusion ?? 0}%
—— 喵机妙算 Meowracle Machine`;
      navigator.clipboard?.writeText(t).then(
        () => { const b = $("#copyBtn"); b.textContent = "✅ 已复制,去立项"; setTimeout(() => (b.textContent = "📋 复制创意去立项"), 1800); },
        () => alert(t)
      );
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[m]));
    }
  </script>
</body>
</html>
